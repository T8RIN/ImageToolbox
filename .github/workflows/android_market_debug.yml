name: Android CI Market Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          java-package: 'jdk'
          cache: gradle

      - name: Build Market Debug APKs
        run: bash ./gradlew assembleMarketDebug

      - name: Upload Market Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Market Debug Universal APK
          path: app/build/outputs/apk/market/debug/*universal*.apk

      - name: Delete Market Debug APKs
        run: rm -rf app/build/outputs/apk/market
